name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much as you can — a minimal reproduction is the single most useful thing you can provide.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or repository that reproduces the issue.
      render: python
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Your Python, Django, Wagtail, and wagtail-app-builder versions.
      placeholder: "Python 3.12, Django 5.0, Wagtail 6.0, wagtail-app-builder 0.1.0"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Logs, tracebacks, screenshots, or other context.
    validations:
      required: false
