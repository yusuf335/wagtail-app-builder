name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is in an early design phase, so feature discussions directly shape the roadmap. Please describe the use case first, not just the solution.

  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow this would help with.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have one in mind, describe how it might work.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or thought about.
    validations:
      required: false
